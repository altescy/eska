name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Verify package.json matches the release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # electron-builder writes to release/<package.json version>/, so a
          # mismatch here silently produces a release with no assets.
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: List release files
        shell: bash
        run: |
          echo "Looking for files in: release/${{ steps.version.outputs.version }}/"
          ls -la release/${{ steps.version.outputs.version }}/ || echo "Directory not found"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ steps.version.outputs.version }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-cask:
    name: Update Homebrew cask
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Get version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the macOS installer from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "Eska-Mac-${VERSION}-Installer.dmg" \
            --dir cask-asset

      - name: Compute SHA256 of the installer
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(sha256sum "cask-asset/Eska-Mac-${VERSION}-Installer.dmg" | cut -d " " -f 1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: Update the Cask formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          sed -i -E "s|^(  version )\".*\"$|\1\"${VERSION}\"|" Casks/eska.rb
          sed -i -E "s|^(  sha256 )\".*\"$|\1\"${SHA256}\"|" Casks/eska.rb

          # Fail loudly rather than committing a formula the substitutions missed.
          grep -qF "  version \"${VERSION}\"" Casks/eska.rb
          grep -qF "  sha256 \"${SHA256}\"" Casks/eska.rb
          ruby -c Casks/eska.rb
          cat Casks/eska.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/eska.rb

          if git diff --cached --quiet; then
            echo "Cask is already up to date."
            exit 0
          fi

          git commit -m "Update Homebrew cask to ${VERSION}"

          # main may have moved while the release was building.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep 5
          done
          exit 1
